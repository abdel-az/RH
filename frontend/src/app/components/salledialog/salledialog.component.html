<h1 mat-dialog-title> Ajouter Salle </h1>
<div mat-dialog-content>
    <form [formGroup]="salleForm">

        <mat-form-field appearance="outline">
            <mat-label> Nom</mat-label>
            <input formControlName="nom" matInput placeholder="Name">
        </mat-form-field>

    </form>
    
</div>

<div mat-dialog-action [align]="'end'">
    <button mat-raised-button color="warn" mat-dialog-close>Close</button>
    <button style="margin-left: 8px ;" mat-raised-button color="primary" (click)="addSalle()" >{{optionBtn}}</button>

</div>
